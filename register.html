<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | PureSanity Customer Portal</title>
  <meta name="description" content="Register for a PureSanity account to book mattress deep cleaning, track mobile technician dispatch, and access package deals.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css" id="rtl-stylesheet" disabled>
  
  <style>
    .auth-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: var(--bg-light);
    }
    .auth-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      text-align: center;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.85rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 0.75rem;
      transition: var(--transition);
    }
    .social-btn:hover {
      background: var(--bg-light);
      border-color: var(--primary);
    }
    .auth-divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }
    .auth-divider span {
      padding: 0 1rem;
    }
    
    .auth-actions {
      position: absolute;
      top: 2rem;
      right: 2rem;
      display: flex;
      gap: 0.75rem;
    }
    @media (max-width: 576px) {
      .auth-page-wrap {
        flex-direction: column;
      }
      .auth-actions {
        position: relative;
        top: auto;
        right: auto;
        width: 100%;
        max-width: 480px;
        justify-content: flex-end;
        margin-bottom: 1.25rem;
      }
      .auth-card {
        padding: 2.5rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="auth-page-wrap">
    <div class="auth-actions">
      <button class="icon-btn theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Theme"><i class="fas fa-moon"></i></button>
      <button class="icon-btn rtl-toggle-btn" aria-label="Toggle RTL" title="Toggle RTL"><i class="fas fa-right-left"></i></button>
    </div>
    
    <div class="auth-card">
      <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 1.5rem;">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="#123B3A"/>
          <path d="M12 28C12 21.3726 17.3726 16 24 16H28V20C28 24.4183 24.4183 28 20 28H12Z" fill="#B9D8D1"/>
          <circle cx="27" cy="13" r="4" fill="#E8A84E"/>
        </svg>
        <span>PURE<span class="highlight">SANITY</span></span>
      </a>

      <h2 style="font-size: 1.25rem; margin-bottom: 0.5rem;">CREATE AN ACCOUNT</h2>
      <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 2rem;">Join PureSanity for priority home visit scheduling.</p>

      <form id="register-form">
        <div class="form-group auth-form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Eleanor Vance" required>
        </div>

        <div class="form-group auth-form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@domain.com" required>
        </div>

        <div class="form-group auth-form-group">
          <label class="form-label">Password (Min. 8 characters)</label>
          <div style="position: relative;">
            <input type="password" id="reg-pass" class="form-control auth-password-input" placeholder="••••••••" required minlength="8">
            <i class="fas fa-eye auth-password-icon" onclick="const passInput = this.previousElementSibling; if (passInput.type === 'password') { passInput.type = 'text'; this.classList.remove('fa-eye'); this.classList.add('fa-eye-slash'); } else { passInput.type = 'password'; this.classList.remove('fa-eye-slash'); this.classList.add('fa-eye'); }"></i>
          </div>
        </div>

        <div class="form-group auth-form-group">
          <label class="form-label">Confirm Password</label>
          <div style="position: relative;">
            <input type="password" id="reg-confirm" class="form-control auth-password-input" placeholder="••••••••" required minlength="8">
            <i class="fas fa-eye auth-password-icon" onclick="const confirmInput = this.previousElementSibling; if (confirmInput.type === 'password') { confirmInput.type = 'text'; this.classList.remove('fa-eye'); this.classList.add('fa-eye-slash'); } else { confirmInput.type = 'password'; this.classList.remove('fa-eye-slash'); this.classList.add('fa-eye'); }"></i>
          </div>
          <div id="pass-match-error" style="color: #dc3545; font-size: 0.8rem; display: none; margin-top: 0.25rem;">Passwords do not match.</div>
        </div>

        <div class="auth-form-group" style="margin-bottom: 1.5rem;">
          <label style="display: flex; gap: 0.5rem; align-items: center; font-size: 0.85rem; color: var(--text-muted);">
            <input type="checkbox" required> I agree to the Terms of Service & Privacy Policy
          </label>
        </div>

        <button type="submit" class="btn btn-accent" style="width: 100%; margin-bottom: 1.5rem;">Create Account</button>
      </form>

      <div class="auth-divider"><span>OR CONTINUE WITH</span></div>

      <!-- Social Logins -->
      <button class="social-btn"><i class="fab fa-google" style="color: #ea4335;"></i> Sign up with Google</button>
      <button class="social-btn"><i class="fab fa-apple"></i> Sign up with Apple</button>

      <div style="margin-top: 2rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Log In</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const pass = document.getElementById('reg-pass').value;
      const confirm = document.getElementById('reg-confirm').value;
      const err = document.getElementById('pass-match-error');

      if (pass !== confirm) {
        err.style.display = 'block';
      } else {
        err.style.display = 'none';
        alert('Account created successfully! Redirecting to login...');
        window.location.href = 'login.html';
      }
    });
  </script>
  <script src="assets/js/main.js"></script>
</body>
</html>
