<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) | PureSanity</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  
  <style>
    .error-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      text-align: center;
      background: var(--bg-light);
    }
    .error-card {
      max-width: 540px;
    }
    .error-code {
      font-family: var(--font-heading);
      font-size: 7rem;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="error-page-wrap">
    <div class="error-card">
      <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 2rem;">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="#123B3A"/>
          <path d="M12 28C12 21.3726 17.3726 16 24 16H28V20C28 24.4183 24.4183 28 20 28H12Z" fill="#B9D8D1"/>
          <circle cx="27" cy="13" r="4" fill="#E8A84E"/>
        </svg>
        <span>PURE<span class="highlight">SANITY</span></span>
      </a>

      <div class="error-code">404</div>
      <h2 style="margin-bottom: 1rem;">THIS PAGE HAS BEEN DEEP CLEANED AWAY</h2>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">The page you are searching for might have been moved, renamed, or is temporarily unavailable.</p>
      
      <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="index.html" class="btn btn-accent"><i class="fas fa-house"></i> Return Home</a>
        <a href="contact.html" class="btn btn-outline"><i class="fas fa-headset"></i> Contact Support</a>
      </div>
    </div>
  </div>

</body>
</html>
